AWSTemplateFormatVersion: '2010-09-09'
Description: >
  IAM Policies for CDK CloudFormation Execution Role
  This creates multiple managed policies with minimum required permissions
  for CDK to deploy Wiki Project infrastructure.

  Usage:
    1. Deploy this stack first:
       AWS_PROFILE=wiki aws cloudformation deploy \
         --template-file cfn-execution-policies.yaml \
         --stack-name stack-wiki-infra-cfn-execution-policies \
         --capabilities CAPABILITY_NAMED_IAM \
         --region ap-northeast-1

    2. Use the policy ARNs for CDK bootstrap:
       AWS_PROFILE=wiki cdk bootstrap \
         --cloudformation-execution-policies \
           arn:aws:iam::XXXXXXXXXXXX:policy/policy-wiki-infra-cfn-exec-cognito-dsql \
           arn:aws:iam::XXXXXXXXXXXX:policy/policy-wiki-infra-cfn-exec-storage \
           arn:aws:iam::XXXXXXXXXXXX:policy/policy-wiki-infra-cfn-exec-config \
           arn:aws:iam::XXXXXXXXXXXX:policy/policy-wiki-infra-cfn-exec-iam \
         --region ap-northeast-1

Parameters:
  PolicyNamePrefix:
    Type: String
    Default: policy-wiki-infra-cfn-exec
    Description: Prefix for IAM policy names

Resources:
  # =====================================
  # Policy 1: Cognito & DSQL
  # =====================================
  CognitoDSQLPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${PolicyNamePrefix}-cognito-dsql'
      Description: Cognito and DSQL permissions for CDK CloudFormation execution
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CognitoUserPool
            Effect: Allow
            Action:
              - cognito-idp:CreateUserPool
              - cognito-idp:DeleteUserPool
              - cognito-idp:DescribeUserPool
              - cognito-idp:UpdateUserPool
              - cognito-idp:SetUserPoolMfaConfig
              - cognito-idp:GetUserPoolMfaConfig
            Resource: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*'

          - Sid: CognitoUserPoolClient
            Effect: Allow
            Action:
              - cognito-idp:CreateUserPoolClient
              - cognito-idp:DeleteUserPoolClient
              - cognito-idp:DescribeUserPoolClient
              - cognito-idp:UpdateUserPoolClient
            Resource: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*'

          - Sid: CognitoTags
            Effect: Allow
            Action:
              - cognito-idp:ListTagsForResource
              - cognito-idp:TagResource
              - cognito-idp:UntagResource
            Resource: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*'

          - Sid: DSQLCluster
            Effect: Allow
            Action:
              - dsql:CreateCluster
              - dsql:DeleteCluster
              - dsql:GetCluster
              - dsql:UpdateCluster
              - dsql:ListClusters
            Resource: !Sub 'arn:aws:dsql:${AWS::Region}:${AWS::AccountId}:cluster/*'

          - Sid: DSQLTags
            Effect: Allow
            Action:
              - dsql:TagResource
              - dsql:UntagResource
              - dsql:ListTagsForResource
            Resource: !Sub 'arn:aws:dsql:${AWS::Region}:${AWS::AccountId}:cluster/*'

  # =====================================
  # Policy 2: S3 & CloudFront
  # =====================================
  StoragePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${PolicyNamePrefix}-storage'
      Description: S3 and CloudFront permissions for CDK CloudFormation execution
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: S3BucketManagement
            Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:DeleteBucket
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource: 'arn:aws:s3:::*'

          - Sid: S3BucketConfiguration
            Effect: Allow
            Action:
              - s3:PutBucketPolicy
              - s3:DeleteBucketPolicy
              - s3:GetBucketPolicy
              - s3:PutBucketPublicAccessBlock
              - s3:GetBucketPublicAccessBlock
              - s3:PutBucketVersioning
              - s3:GetBucketVersioning
              - s3:PutBucketEncryption
              - s3:GetBucketEncryption
              - s3:PutBucketCORS
              - s3:GetBucketCORS
              - s3:PutBucketTagging
              - s3:GetBucketTagging
              - s3:PutBucketLogging
              - s3:GetBucketLogging
              - s3:PutLifecycleConfiguration
              - s3:GetLifecycleConfiguration
            Resource: 'arn:aws:s3:::*'

          - Sid: S3ObjectOperations
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:GetObjectVersion
              - s3:DeleteObjectVersion
            Resource: 'arn:aws:s3:::*/*'

          - Sid: CloudFrontDistribution
            Effect: Allow
            Action:
              - cloudfront:CreateDistribution
              - cloudfront:DeleteDistribution
              - cloudfront:GetDistribution
              - cloudfront:GetDistributionConfig
              - cloudfront:UpdateDistribution
            Resource: '*'

          - Sid: CloudFrontOriginAccessControl
            Effect: Allow
            Action:
              - cloudfront:CreateOriginAccessControl
              - cloudfront:DeleteOriginAccessControl
              - cloudfront:GetOriginAccessControl
              - cloudfront:GetOriginAccessControlConfig
              - cloudfront:UpdateOriginAccessControl
            Resource: '*'

          - Sid: CloudFrontTags
            Effect: Allow
            Action:
              - cloudfront:TagResource
              - cloudfront:UntagResource
              - cloudfront:ListTagsForResource
            Resource: '*'

  # =====================================
  # Policy 3: SSM & ACM (Read-only)
  # =====================================
  ConfigPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${PolicyNamePrefix}-config'
      Description: SSM and ACM permissions for CDK CloudFormation execution
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SSMParameterWrite
            Effect: Allow
            Action:
              - ssm:PutParameter
              - ssm:DeleteParameter
            Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/*'

          - Sid: SSMParameterRead
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:GetParametersByPath
              - ssm:DescribeParameters
            Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/*'

          - Sid: SSMParameterTags
            Effect: Allow
            Action:
              - ssm:AddTagsToResource
              - ssm:RemoveTagsFromResource
              - ssm:ListTagsForResource
            Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/*'

          - Sid: ACMCertificateRead
            Effect: Allow
            Action:
              - acm:DescribeCertificate
              - acm:ListCertificates
              - acm:GetCertificate
              - acm:ListTagsForCertificate
            Resource: '*'

          - Sid: LambdaFunction
            Effect: Allow
            Action:
              - lambda:CreateFunction
              - lambda:DeleteFunction
              - lambda:GetFunction
              - lambda:UpdateFunctionCode
              - lambda:UpdateFunctionConfiguration
              - lambda:GetFunctionConfiguration
              - lambda:InvokeFunction
            Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*'

          - Sid: LambdaPermissions
            Effect: Allow
            Action:
              - lambda:AddPermission
              - lambda:RemovePermission
            Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*'

          - Sid: LambdaTags
            Effect: Allow
            Action:
              - lambda:TagResource
              - lambda:UntagResource
              - lambda:ListTags
            Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*'

          - Sid: CloudWatchLogsForLambda
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
              - logs:DeleteLogGroup
              - logs:DescribeLogGroups
              - logs:DescribeLogStreams
              - logs:PutRetentionPolicy
              - logs:DeleteRetentionPolicy
            Resource:
              - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*'
              - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*:*'

          - Sid: CloudWatchLogsTags
            Effect: Allow
            Action:
              - logs:TagResource
              - logs:UntagResource
              - logs:ListTagsForResource
            Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*'

  # =====================================
  # Policy 4: IAM
  # =====================================
  IAMPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${PolicyNamePrefix}-iam'
      Description: IAM permissions for CDK CloudFormation execution
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: IAMRoleManagement
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:GetRole
              - iam:UpdateRole
              - iam:UpdateAssumeRolePolicy
            Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/*'

          - Sid: IAMRolePolicyManagement
            Effect: Allow
            Action:
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:GetRolePolicy
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:ListRolePolicies
              - iam:ListAttachedRolePolicies
            Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/*'

          - Sid: IAMRoleTags
            Effect: Allow
            Action:
              - iam:TagRole
              - iam:UntagRole
            Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/*'

          - Sid: IAMPolicyManagement
            Effect: Allow
            Action:
              - iam:CreatePolicy
              - iam:DeletePolicy
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - iam:ListPolicyVersions
            Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/*'

          - Sid: IAMPolicyVersionManagement
            Effect: Allow
            Action:
              - iam:CreatePolicyVersion
              - iam:DeletePolicyVersion
            Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/*'

          - Sid: IAMPolicyTags
            Effect: Allow
            Action:
              - iam:TagPolicy
              - iam:UntagPolicy
            Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/*'

          - Sid: IAMPassRole
            Effect: Allow
            Action:
              - iam:PassRole
            Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/stack-*'

Outputs:
  CognitoDSQLPolicyArn:
    Description: ARN of Cognito and DSQL policy
    Value: !Ref CognitoDSQLPolicy
    Export:
      Name: !Sub '${AWS::StackName}-CognitoDSQLPolicyArn'

  StoragePolicyArn:
    Description: ARN of Storage (S3 & CloudFront) policy
    Value: !Ref StoragePolicy
    Export:
      Name: !Sub '${AWS::StackName}-StoragePolicyArn'

  ConfigPolicyArn:
    Description: ARN of Config (SSM & ACM) policy
    Value: !Ref ConfigPolicy
    Export:
      Name: !Sub '${AWS::StackName}-ConfigPolicyArn'

  IAMPolicyArn:
    Description: ARN of IAM policy
    Value: !Ref IAMPolicy
    Export:
      Name: !Sub '${AWS::StackName}-IAMPolicyArn'

  AllPolicyArns:
    Description: Comma-separated list of all policy ARNs for CDK bootstrap
    Value: !Sub '${CognitoDSQLPolicy},${StoragePolicy},${ConfigPolicy},${IAMPolicy}'

  BootstrapCommand:
    Description: Command to use these policies with CDK bootstrap
    Value: !Sub |
      AWS_PROFILE=wiki cdk bootstrap \
        --cloudformation-execution-policies ${CognitoDSQLPolicy} ${StoragePolicy} ${ConfigPolicy} ${IAMPolicy} \
        --region ${AWS::Region}
